name: Gesture controls validation

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ubuntu-3.12-logic
            os: ubuntu-latest
            native: false
          - label: macos-3.12-native
            os: macos-latest
            native: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install logic-test dependencies
        if: ${{ !matrix.native }}
        run: |
          python -m pip install --only-binary=:all: numpy==2.3.5 opencv-contrib-python==4.13.0.92
          python -m pip check

      - name: Install native runtime
        if: ${{ matrix.native }}
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt
          python -m pip check

      - name: Run test suite
        run: |
          python -B -m unittest discover -s tests -v

      - name: Acquire and verify gesture model
        if: ${{ matrix.native }}
        run: |
          python app.py model

      - name: Native image/video startup check
        if: ${{ matrix.native }}
        run: |
          python app.py check
