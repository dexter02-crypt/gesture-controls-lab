name: Logic and fixture checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 opencv-contrib-python==4.13.0.92
      - run: python -m unittest discover -s tests -v
# Native model installation, real camera checks and accuracy are NOT covered.
